apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-allow-cart
  namespace: orders
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orders-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - cart