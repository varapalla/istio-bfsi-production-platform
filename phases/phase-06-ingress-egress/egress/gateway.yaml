apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payments-egress
  namespace: payments
  labels:
    app.kubernetes.io/name: payments-egress
    app.kubernetes.io/part-of: bfsi-platform
    app.kubernetes.io/component: egress-gateway

  annotations:
    networking.istio.io/service-type: ClusterIP

spec:
  gatewayClassName: istio

  listeners:
    - name: https
      hostname: api.payment-provider.example
      port: 443
      protocol: TLS

      tls:
        mode: Passthrough

      allowedRoutes:
        namespaces:
          from: Same