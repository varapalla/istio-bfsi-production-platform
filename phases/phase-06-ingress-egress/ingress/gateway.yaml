apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bfsi-ingress
  namespace: istio-ingress
  labels:
    app.kubernetes.io/name: bfsi-ingress
    app.kubernetes.io/part-of: bfsi-platform
    app.kubernetes.io/component: ingress-gateway
spec:
  gatewayClassName: istio

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.bfsi.example.com"

      tls:
        mode: Terminate
        certificateRefs:
          - name: bfsi-ingress-tls

      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              bfsi.example.com/ingress-allowed: "true"