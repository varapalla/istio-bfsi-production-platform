apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-ztunnel
  namespace: monitoring
  labels:
    app.kubernetes.io/name: istio-ztunnel
    app.kubernetes.io/part-of: istio-bfsi-platform
spec:
  namespaceSelector:
    matchNames:
      - istio-system

  selector:
    matchLabels:
      app: ztunnel

  endpoints:
    - port: http-monitoring
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s