apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bfsi-environments
  namespace: argocd
spec:
  goTemplate: true

  generators:
    - git:
        repoURL: https://github.com/varapalla/istio-bfsi-production-platform.git
        revision: main
        directories:
          - path: environments/*

  template:
    metadata:
      name: "bfsi-{{.path.basename}}"

    spec:
      project: bfsi-platform

      source:
        repoURL: https://github.com/varapalla/istio-bfsi-production-platform.git
        targetRevision: main
        path: "{{.path.path}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"

      syncPolicy:
        automated:
          selfHeal: true
          prune: false